# Codex baseline config.
#
# This is a hand-curated STARTING POINT, not a live mirror. Codex (and the
# ChatGPT desktop app) rewrite ~/.codex/config.toml constantly — adding machine
# paths, project trust entries, generated MCP servers, browser client hashes,
# app version numbers, etc. install.sh therefore COPIES this file into place
# only when ~/.codex/config.toml is absent; it does not symlink it. Keep only
# portable preferences here.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approval_policy = "on-request"
approvals_reviewer = "guardian_subagent"
sandbox_mode = "workspace-write"

[features]
js_repl = false

# Codex plugin enablement (portable; the marketplace source paths Codex adds are not)
[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."linear@openai-curated"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[desktop]
usePointerCursors = false
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
appearanceDarkCodeThemeId = "linear"
appearanceLightCodeThemeId = "linear"
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = true

[desktop.open-in-target-preferences]
global = "vscode"

[desktop.appearanceDarkChromeTheme]
accent = "#606acc"
contrast = 60
ink = "#e3e4e6"
opaqueWindows = true
surface = "#0f0f11"

[desktop.appearanceDarkChromeTheme.fonts]
ui = "Inter"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#69c967"
diffRemoved = "#ff7e78"
skill = "#c2a1ff"

[desktop.appearanceLightChromeTheme]
accent = "#5e6ad2"
contrast = 45
ink = "#1b1b1b"
opaqueWindows = true
surface = "#fcfcfd"

[desktop.appearanceLightChromeTheme.fonts]
ui = "Inter"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#52a450"
diffRemoved = "#c94446"
skill = "#8160d8"
